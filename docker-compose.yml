services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: buzz8n-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 'password'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buzz8n -d buzz8n']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Queue
  redis:
    image: redis:6-alpine
    container_name: buzz8n-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
