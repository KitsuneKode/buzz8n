version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: buzz8n-postgres
    environment:
      POSTGRES_DB: buzz8n
      POSTGRES_USER: buzz8n
      POSTGRES_PASSWORD: buzz8n_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz8n -d buzz8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buzz8n-network

  # Redis Cache and Queue
  redis:
    image: redis:6-alpine
    container_name: buzz8n-redis
    command: redis-server --appendonly yes --requirepass buzz8n_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - buzz8n-network

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: buzz8n-web
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://buzz8n:buzz8n_password@postgres:5432/buzz8n
      - REDIS_URL=redis://:buzz8n_redis_password@redis:6379
      - JWT_SECRET=dev-jwt-secret-key
      - BASE_URL=http://localhost:3000
      - API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    networks:
      - buzz8n-network
    restart: unless-stopped

  # Express API Server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: buzz8n-server
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://buzz8n:buzz8n_password@postgres:5432/buzz8n
      - REDIS_URL=redis://:buzz8n_redis_password@redis:6379
      - JWT_SECRET=dev-jwt-secret-key
      - BASE_URL=http://localhost:3000
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/server:/app/apps/server
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/server/node_modules
    networks:
      - buzz8n-network
    restart: unless-stopped

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: buzz8n-worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://buzz8n:buzz8n_password@postgres:5432/buzz8n
      - REDIS_URL=redis://:buzz8n_redis_password@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/worker/node_modules
    networks:
      - buzz8n-network
    restart: unless-stopped
    deploy:
      replicas: 1

  # Database Migration Service
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: buzz8n-migrate
    environment:
      - DATABASE_URL=postgresql://buzz8n:buzz8n_password@postgres:5432/buzz8n
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buzz8n-network
    profiles:
      - tools

  # Redis Migration Service
  redis-migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: buzz8n-redis-migrate
    environment:
      - REDIS_URL=redis://:buzz8n_redis_password@redis:6379
    command: ["bun", "run", "redis:migrate"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - buzz8n-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  buzz8n-network:
    driver: bridge







