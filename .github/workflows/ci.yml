name: CI

on:
  push:
    branches: [ main, prod, develop ]
  pull_request:
    types: [opened, synchronize]
    

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
            fetch-depth: 0
            filter: blob:none

      - name: Fetch base branch
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"
          git fetch origin $BASE --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun db:generate


      - name: Prettier check
        run: bun turbo run format:check --affected

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
            fetch-depth: 0
            filter: blob:none

      - name: Fetch base branch
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"
          git fetch origin $BASE --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun db:generate

      - name: ESLint
        run: bun run lint --affected

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
            fetch-depth: 0
            filter: blob:none

      - name: Fetch base branch
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"
          git fetch origin $BASE --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun db:generate

      - name: TS check
        run: bun run check-types --affected

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
            fetch-depth: 0
            filter: blob:none

      - name: Fetch base branch
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"
          git fetch origin $BASE --depth=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun db:generate

      - name: Build packages
        run: bun run build --affected

