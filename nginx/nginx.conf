# Upstreams - connection pooling
upstream express_backend {
    server localhost:8080;
    keepalive 32;
}

upstream websocket_backend {
    server localhost:8082;
    keepalive 32;
}

# ============================================
# API - api.buzz8n.kitsunelabs.xyz → Express :8080
# ============================================
server {
    listen 80;
    server_name api.buzz8n.kitsunelabs.xyz;

    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    # Payload size
    client_max_body_size 10M;

    location / {
        proxy_pass http://express_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Reasonable timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================
# Webhooks - webhook.buzz8n.kitsunelabs.xyz/123 → Express /webhook/123
# ============================================
server {
    listen 80;
    server_name webhook.buzz8n.kitsunelabs.xyz;

    access_log /var/log/nginx/webhook.access.log;
    error_log /var/log/nginx/webhook.error.log;

    # Larger payload for webhook data
    client_max_body_size 15M;

    location / {
        # Rewrite: /123 → /webhook/123
        rewrite ^/(.*)$ /webhook/$1 break;

        proxy_pass http://express_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Longer timeouts for webhook processing
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}

# ============================================
# WebSocket - ws.buzz8n.kitsunelabs.xyz → WS Server :8082
# ============================================
server {
    listen 80;
    server_name ws.buzz8n.kitsunelabs.xyz;

    access_log /var/log/nginx/ws.access.log;
    error_log /var/log/nginx/ws.error.log;

    location / {
        proxy_pass http://websocket_backend;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers + cookies for auth
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # Long timeouts for persistent connections
        proxy_connect_timeout 1h;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;

        # No buffering for WebSockets
        proxy_buffering off;
    }
}
